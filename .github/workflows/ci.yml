name: EKIA Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite greenlet

      - name: Run Pytest Suite with Coverage
        env:
          GEMINI_API_KEY: "fake-test-key-for-ci"
          SECRET_KEY: "ci-test-secret-key-for-jwt-signing-enterprise"
          TESTING: "true"
          APP_ENV: "test"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SYNC_DATABASE_URL: "sqlite:///:memory:"
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: |
          cd backend
          pytest -v --tb=short

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Production Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: |
          cd frontend
          npm run build

  docker-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build -t ekia-backend:test ./backend
