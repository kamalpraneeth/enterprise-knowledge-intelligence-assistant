services:
  # ── PostgreSQL with pgvector ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekia_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ekia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekia_password}
      POSTGRES_DB: ${POSTGRES_DB:-ekia_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekia_user} -d ${POSTGRES_DB:-ekia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ekia_backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ekia_user}:${POSTGRES_PASSWORD:-ekia_password}@postgres:5432/${POSTGRES_DB:-ekia_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-ekia_user}:${POSTGRES_PASSWORD:-ekia_password}@postgres:5432/${POSTGRES_DB:-ekia_db}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-models/text-embedding-004}
      LLM_MODEL: ${LLM_MODEL:-gemini-1.5-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ekia_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: EKIA
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
